<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Health Hub">
<meta name="theme-color" content="#F5F6F7">
<title>Health Hub</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preload" as="font" type="font/woff2" href="/fonts/LibreFranklin-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/LibreFranklin-500.woff2" crossorigin>
<style>
  /* Self-hosted Libre Franklin (OFL) · no third-party request, precached by sw.js.
     Three weights only. The 600 face covers 600-900, so a heavier weight
     anywhere in the UI renders as 600 instead of a faked bold. */
  @font-face{font-family:'Libre Franklin';font-style:normal;font-weight:100 400;font-display:swap;src:url(/fonts/LibreFranklin-400.woff2) format('woff2')}
  @font-face{font-family:'Libre Franklin';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/LibreFranklin-500.woff2) format('woff2')}
  @font-face{font-family:'Libre Franklin';font-style:normal;font-weight:600 900;font-display:swap;src:url(/fonts/LibreFranklin-600.woff2) format('woff2')}

  /* ═══ DAY LINE · the only place hex colors are allowed ═══
     Cool gray page, white cards, gray lines. Ember means "now" and the main
     action, nothing else. Green = on track or earned. Deep red = destructive
     or broken only. Everything else is neutral gray; there is deliberately
     no amber/warning tier.
     Light mode only. Dark mode was removed on purpose; do not add it back. */
  :root {
    --bg: #F5F6F7; --surface: #FFFFFF; --ink: #17191C; --ink-2: #3D4148; --muted: #62666D; --faint: #9EA3AA;
    --accent: #C2410C; --accent-press: #9A3412;
    --danger: #B91C1C; --good: #2F7A3E; --line: #E3E5E8;
    --on-accent: #FFFFFF;
    --accent-soft: #FBEDE5;
    --danger-soft: color-mix(in srgb, var(--danger) 9%, var(--surface));
    --good-soft: color-mix(in srgb, var(--good) 9%, var(--surface));
    --scrim: color-mix(in srgb, var(--ink) 40%, transparent);
    --shadow: 0 8px 24px color-mix(in srgb, var(--ink) 8%, transparent);
    --shadow-2: none;
    --on-accent-line: color-mix(in srgb, var(--on-accent) 40%, transparent);
    --on-accent-dim: color-mix(in srgb, var(--on-accent) 70%, transparent);
    --accent-glow: none;
    --tabbar-h: 64px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overscroll-behavior-y: contain; }
  body { font-family: 'Libre Franklin', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; -webkit-text-size-adjust: 100%; }
  #root { min-height: 100vh; min-height: 100dvh; }
  button, input, select { -webkit-font-smoothing: antialiased; font: inherit; color: inherit; }
  /* Tabular figures on numbers only: inputs and anything marked .n */
  input, .n { font-variant-numeric: tabular-nums; }
  button { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: transform .08s ease, opacity .12s ease; }
  button:active:not(:disabled) { transform: scale(.97); }
  input::placeholder { color: var(--muted); opacity: .7; }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  [hidden] { display: none !important; }

  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes shimmer { 0% { background-position: -300px 0 } 100% { background-position: 300px 0 } }
  .hh-fade { animation: fadeIn .16s ease both; }
  .hh-sheet { animation: sheetUp .22s cubic-bezier(.2,.8,.2,1) both; }
  .hh-toast { animation: toastIn .22s ease both; }
  @media (prefers-reduced-motion: reduce) { .hh-fade, .hh-sheet, .hh-toast { animation: none } button { transition: none } }

  /* Boot skeleton · replaced the moment React renders. */
  .boot { max-width: 520px; margin: 0 auto; padding: 18px 14px; }
  .boot .ln { height: 14px; width: 40%; border-radius: 6px; margin-bottom: 12px; }
  .boot .cd { height: 120px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--line); }
  .boot .ln, .boot .cd { background: linear-gradient(90deg, var(--surface) 0%, var(--line) 50%, var(--surface) 100%); background-size: 600px 100%; animation: shimmer 1.2s linear infinite; }
</style>
<script src="/vendor/react.production.min.js" defer></script>
<script src="/vendor/react-dom.production.min.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div id="root"><div class="boot" aria-hidden="true"><div class="ln"></div><div class="cd"></div><div class="cd" style="height:88px"></div><div class="cd" style="height:150px"></div></div></div>
</body>
</html>
