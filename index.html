<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Health Hub">
<meta name="theme-color" content="#F4F2EF">
<title>Health Hub</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preload" as="font" type="font/woff2" href="/fonts/Barlow-600.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/BarlowCondensed-800.woff2" crossorigin>
<style>
  /* Self-hosted Barlow (OFL) · no third-party request, precached by sw.js. */
  @font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/Barlow-400.woff2) format('woff2')}
  @font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/Barlow-500.woff2) format('woff2')}
  @font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/Barlow-600.woff2) format('woff2')}
  @font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/Barlow-700.woff2) format('woff2')}
  @font-face{font-family:'Barlow';font-style:normal;font-weight:800;font-display:swap;src:url(/fonts/Barlow-800.woff2) format('woff2')}
  @font-face{font-family:'Barlow';font-style:italic;font-weight:600;font-display:swap;src:url(/fonts/Barlow-600i.woff2) format('woff2')}
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/BarlowCondensed-500.woff2) format('woff2')}
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/BarlowCondensed-600.woff2) format('woff2')}
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/BarlowCondensed-700.woff2) format('woff2')}
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(/fonts/BarlowCondensed-800.woff2) format('woff2')}

  /* ═══ IRON & EMBER · the only place hex colors are allowed ═══
     Warm paper + graphite; ember is the ONLY brand color, reserved for
     actions. Olive = earned, deep red = destructive only; everything else
     is graphite · there is deliberately no amber/warning tier.
     Light mode only. Dark mode was removed on purpose; do not add it back. */
  :root {
    --bg: #F4F2EF; --surface: #FFFFFF; --ink: #1A1714; --muted: #6B645C;
    --accent: #C2410C; --accent-press: #9A3412;
    --danger: #B91C1C; --good: #4D7C0F; --line: #E6E2DC;
    --on-accent: #FFFFFF;
    --ink-2: color-mix(in srgb, var(--ink) 62%, var(--muted));
    --accent-soft: #F9EBE2;
    --danger-soft: color-mix(in srgb, var(--danger) 10%, var(--surface));
    --good-soft: color-mix(in srgb, var(--good) 10%, var(--surface));
    --scrim: color-mix(in srgb, var(--ink) 45%, transparent);
    --shadow: 0 10px 28px color-mix(in srgb, var(--ink) 7%, transparent);
    --shadow-2: 0 6px 18px color-mix(in srgb, var(--ink) 6%, transparent);
    --on-accent-line: color-mix(in srgb, var(--on-accent) 40%, transparent);
    --on-accent-dim: color-mix(in srgb, var(--on-accent) 65%, transparent);
    --accent-glow: 0 8px 20px color-mix(in srgb, var(--accent) 28%, transparent);
    --tabbar-h: 64px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overscroll-behavior-y: contain; }
  body { font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--ink); overflow-x: hidden; font-variant-numeric: tabular-nums; overscroll-behavior-y: contain; -webkit-text-size-adjust: 100%; }
  #root { min-height: 100vh; min-height: 100dvh; }
  button, input, select { -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; font: inherit; color: inherit; }
  button { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: transform .08s ease, opacity .12s ease; }
  button:active:not(:disabled) { transform: scale(.97); }
  input::placeholder { color: var(--muted); opacity: .7; }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  [hidden] { display: none !important; }

  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes shimmer { 0% { background-position: -300px 0 } 100% { background-position: 300px 0 } }
  .hh-fade { animation: fadeIn .16s ease both; }
  .hh-sheet { animation: sheetUp .22s cubic-bezier(.2,.8,.2,1) both; }
  .hh-toast { animation: toastIn .22s ease both; }
  @media (prefers-reduced-motion: reduce) { .hh-fade, .hh-sheet, .hh-toast { animation: none } button { transition: none } }

  /* Boot skeleton · replaced the moment React renders. */
  .boot { max-width: 520px; margin: 0 auto; padding: 18px 14px; }
  .boot .ln { height: 14px; width: 40%; border-radius: 6px; margin-bottom: 12px; }
  .boot .cd { height: 120px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--line); }
  .boot .ln, .boot .cd { background: linear-gradient(90deg, var(--surface) 0%, var(--line) 50%, var(--surface) 100%); background-size: 600px 100%; animation: shimmer 1.2s linear infinite; }
</style>
<script src="/vendor/react.production.min.js" defer></script>
<script src="/vendor/react-dom.production.min.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div id="root"><div class="boot" aria-hidden="true"><div class="ln"></div><div class="cd"></div><div class="cd" style="height:88px"></div><div class="cd" style="height:150px"></div></div></div>
</body>
</html>
